# Configuration Cloudflare — flux « Worker » du tableau de bord.
#
# worker.js sert la racine du dépôt en fichiers statiques et route
# /api/v1/ensoleillement vers la même fonction que Cloudflare Pages
# (functions/api/v1/ensoleillement.js) : une seule définition de l'API.
#
# .assetsignore écarte node_modules des fichiers publiés : l'outillage de
# Cloudflare y installe wrangler (workerd pèse 122 Mio, la limite d'un
# asset est 25 Mio). Sans lui, le déploiement échoue sur « Asset too large ».
#
# Le dépôt reste aussi déployable en projet Cloudflare **Pages** classique
# (racine publiée, functions/ routé automatiquement) : voir
# docs/HEBERGEMENT.md, option 2.

name = "sunprobe"
main = "worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "."
binding = "ASSETS"
